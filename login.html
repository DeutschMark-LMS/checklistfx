<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Log in | Checklist</title>
  <meta name="theme-color" content="#09090b">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <!-- Firebase Auth SDK (v12) -->
  <script type="module" src="firebaseClient.js"></script>
  <script src="app.js" defer></script>
</head>
<body class="auth-page">

  <div class="auth-container">
    <a href="index.html" class="auth-logo" data-route="index.html">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
      <span>Checklist</span>
    </a>
    
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome back</h1>
        <p>Enter your details to access your journal.</p>
      </div>

      <!-- Live Feedback Alert Banner -->
      <div id="auth-alert" class="auth-alert hidden"></div>
      
      <form class="auth-form" id="login-form" action="#">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="trader@example.com" required autocomplete="email">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember-me" checked> Remember me
          </label>
          <a href="#" class="forgot-password" id="forgot-password-link">Forgot password?</a>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">
          <span id="login-btn-text">Log in</span>
          <span id="login-btn-spinner" class="btn-spinner hidden"></span>
        </button>
      </form>
      
      <div class="auth-divider"><span>or</span></div>
      
      <button type="button" class="btn btn-ghost btn-block auth-social-btn" id="google-login-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
      
      <p class="auth-footer">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const alertBox = document.getElementById('auth-alert');
      const submitBtn = document.getElementById('login-submit-btn');
      const btnText = document.getElementById('login-btn-text');
      const btnSpinner = document.getElementById('login-btn-spinner');
      const googleBtn = document.getElementById('google-login-btn');
      const forgotLink = document.getElementById('forgot-password-link');

      function showAlert(msg, type = 'error') {
        if (!alertBox) return;
        alertBox.textContent = msg;
        alertBox.className = `auth-alert ${type}`;
      }

      function hideAlert() {
        if (!alertBox) return;
        alertBox.className = 'auth-alert hidden';
      }

      function setLoading(loading) {
        if (submitBtn) submitBtn.disabled = loading;
        if (btnText) btnText.textContent = loading ? 'Signing in...' : 'Log in';
        if (btnSpinner) btnSpinner.classList.toggle('hidden', !loading);
      }

      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          hideAlert();
          const email = emailInput.value.trim();
          const password = passwordInput.value;

          if (!email || !password) {
            showAlert('Please enter both email and password.');
            return;
          }

          setLoading(true);

          if (window.DMA_AUTH) {
            const { data, error } = await window.DMA_AUTH.signIn({ email, password });
            setLoading(false);

            if (error) {
              const msg = error.message || 'Failed to authenticate. Please check your credentials.';
              showAlert(msg, 'error');
            } else {
              showAlert('Login successful! Redirecting...', 'success');
              setTimeout(() => {
                window.location.href = 'app.html';
              }, 400);
            }
          } else {
            // Local fallback
            localStorage.setItem('checklist-auth', 'true');
            window.location.href = 'app.html';
          }
        });
      }

      if (googleBtn) {
        googleBtn.addEventListener('click', async () => {
          showAlert('Connecting to Google...', 'info');
          if (window.DMA_AUTH) {
            const res = await window.DMA_AUTH.signInWithGoogle();
            if (res && res.error) {
              showAlert(res.error.message || 'Google sign-in was cancelled or failed.', 'error');
            }
          } else {
            const mockUser = {
              id: 'google-usr-' + Date.now(),
              email: 'trader.google@gmail.com',
              user_metadata: { full_name: 'Google Trader', handle: '@googletrader', trading_style: 'Momentum + Breakout' }
            };
            localStorage.setItem('checklist-auth', 'true');
            localStorage.setItem('dma_user', JSON.stringify(mockUser));
            localStorage.setItem('dma_active_user', JSON.stringify(mockUser));
            window.location.href = 'app.html';
          }
        });
      }

      if (forgotLink) {
        forgotLink.addEventListener('click', async (e) => {
          e.preventDefault();
          const email = prompt('Enter your email address to receive a password reset link:');
          if (email && email.trim()) {
            showAlert('Sending password reset email...', 'info');
            if (window.DMA_AUTH) {
              const { error } = await window.DMA_AUTH.resetPassword(email.trim());
              if (error) {
                showAlert(error.message, 'error');
              } else {
                showAlert('Password reset link sent! Check your inbox.', 'success');
              }
            }
          }
        });
      }
    });
  </script>
</body>
</html>
